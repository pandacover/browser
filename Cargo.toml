[package]
name = "browser"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"

# Windows: the Microsoft Edge WebView2 engine, driven directly through Win32.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

# macOS: WebKit (WKWebView) through wry, a window and event loop from tao, the menu bar from muda.
[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.57"
tao = "0.37"
muda = "0.21"
# AppKit and WebKit directly, for what wry and tao don't cover (pane views, focus, page state).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
