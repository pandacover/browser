<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sidebar</title>
  <link rel="stylesheet" href="chrome.css">
</head>
<body>
  <aside id="sidebar">
    <!-- Acts as the window's title bar (app-region: drag). -->
    <header id="topbar">
      <button id="toggle-sidebar" class="icon-button" title="Hide sidebar (Ctrl+S)" aria-label="Toggle sidebar">
        <svg viewBox="0 0 16 16"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.25"/><path d="M6 2.75v10.5"/></svg>
      </button>
      <button id="back" class="icon-button" title="Back (Alt+Left)" aria-label="Back" disabled>
        <svg viewBox="0 0 16 16"><path d="M9.75 3.5L5.25 8l4.5 4.5"/></svg>
      </button>
      <button id="forward" class="icon-button" title="Forward (Alt+Right)" aria-label="Forward" disabled>
        <svg viewBox="0 0 16 16"><path d="M6.25 3.5L10.75 8l-4.5 4.5"/></svg>
      </button>
      <button id="reload" class="icon-button" title="Reload (F5)" aria-label="Reload">
        <svg class="reload-icon" viewBox="0 0 16 16"><path d="M13.25 8a5.25 5.25 0 1 1-1.54-3.71M12.25 1.75v2.75H9.5"/></svg>
        <svg class="stop-icon" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
      <div class="spacer"></div>
      <div id="window-controls">
        <button id="win-min" class="icon-button" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg>
        </button>
        <button id="win-max" class="icon-button" title="Maximize" aria-label="Maximize">
          <svg class="max-icon" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.75"/></svg>
          <svg class="restore-icon" viewBox="0 0 16 16"><rect x="3.25" y="5.25" width="7.5" height="7.5" rx="1.5"/><path d="M5.75 3.25h5.5a1.5 1.5 0 0 1 1.5 1.5v5.5"/></svg>
        </button>
        <button id="win-close" class="icon-button" title="Close" aria-label="Close">
          <svg viewBox="0 0 16 16"><path d="M4.25 4.25l7.5 7.5M11.75 4.25l-7.5 7.5"/></svg>
        </button>
      </div>
    </header>

    <!-- Shows the current site; clicking it opens the command bar (same as Ctrl+L). -->
    <div id="address-row">
      <button id="address" title="Search or enter address (Ctrl+L)">
        <span id="site-icon" aria-hidden="true"></span>
        <span id="address-text"></span>
      </button>
      <button id="copy-link" class="icon-button" title="Copy link" aria-label="Copy link" tabindex="-1">
        <svg class="copy-icon" viewBox="0 0 16 16"><path d="M6.75 9.25l2.5-2.5M5.5 7.25L4.25 8.5a2.47 2.47 0 0 0 3.5 3.5L9 10.75M7 5.25L8.25 4a2.47 2.47 0 0 1 3.5 3.5L10.5 8.75"/></svg>
        <svg class="done-icon" viewBox="0 0 16 16"><path d="M3.75 8.25l2.75 2.75 5.75-6"/></svg>
      </button>
      <button id="bookmark" class="icon-button" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark" tabindex="-1">
        <svg viewBox="0 0 16 16"><path d="M8 2.25l1.7 3.6 3.9.5-2.9 2.7.75 3.9L8 11.05 4.55 12.95l.75-3.9-2.9-2.7 3.9-.5z"/></svg>
      </button>
    </div>

    <div id="tab-list">
      <!-- The current space. Double-click its name to rename it. -->
      <div id="space-header">
        <span id="space-dot"></span>
        <span id="space-name" title="Double-click to rename"></span>
        <input id="space-rename" type="text" spellcheck="false" maxlength="40" aria-label="Space name" hidden>
      </div>
      <!-- Pinned tabs, then #today (the line, and New Tab), then today's tabs. Dragging a tab
           across the line pins or unpins it. -->
      <div id="tabs" role="tablist" aria-orientation="vertical">
        <div id="today">
          <div class="divider" title="Drag tabs above the line to pin them">
            <span class="line"></span>
            <button id="clear-today" title="Archive today's tabs" tabindex="-1">Clear</button>
          </div>
          <button id="new-tab" class="tab-row" title="New tab (Ctrl+T)">
            <span class="tab-icon"><svg viewBox="0 0 16 16"><path d="M8 3.25v9.5M3.25 8h9.5"/></svg></span>
            <span class="tab-title">New Tab</span>
            <kbd>Ctrl T</kbd>
          </button>
        </div>
      </div>
      <div id="list-fill" title="Double-click for a new tab"></div>
    </div>

    <footer id="footer">
      <button id="archive" class="icon-button" title="Archived tabs" aria-label="Archived tabs">
        <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="3.25" rx="1"/><path d="M3 6.25v5.5a1.25 1.25 0 0 0 1.25 1.25h7.5A1.25 1.25 0 0 0 13 11.75v-5.5M6.5 8.75h3"/></svg>
      </button>
      <div id="space-list" role="tablist" aria-label="Spaces"></div>
      <button id="new-space" class="icon-button" title="New space" aria-label="New space">
        <svg viewBox="0 0 16 16"><path d="M8 3.75v8.5M3.75 8h8.5"/></svg>
      </button>
    </footer>

    <div id="resize-handle" title="Drag to resize the sidebar"></div>
    <div id="menu" role="menu" hidden></div>
  </aside>

  <template id="tab-template">
    <div class="tab tab-row" role="tab">
      <span class="tab-icon">
        <img class="favicon" alt="" draggable="false">
        <svg class="spinner" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/></svg>
      </span>
      <span class="tab-title"></span>
      <span class="tab-split" title="In split view (Ctrl+\)">
        <svg viewBox="0 0 16 16"><rect x="1.75" y="3" width="12.5" height="10" rx="2"/><path d="M8 3v10"/></svg>
      </span>
      <button class="tab-home" title="Back to the pinned page" aria-label="Back to the pinned page" tabindex="-1">
        <svg viewBox="0 0 16 16"><path d="M6.25 4.25L3 7.5l3.25 3.25M3.5 7.5h6a3 3 0 0 1 0 6H8"/></svg>
      </button>
      <button class="tab-audio" title="Mute tab" aria-label="Mute tab" tabindex="-1">
        <svg class="sound-icon" viewBox="0 0 16 16"><path d="M2.75 6.25v3.5h2.5L8.5 12.5v-9L5.25 6.25zM10.75 5.75a3.2 3.2 0 0 1 0 4.5M12.5 4a5.6 5.6 0 0 1 0 8"/></svg>
        <svg class="muted-icon" viewBox="0 0 16 16"><path d="M2.75 6.25v3.5h2.5L8.5 12.5v-9L5.25 6.25zM10.75 6.25l3 3.5M13.75 6.25l-3 3.5"/></svg>
      </button>
      <button class="tab-close" title="Close tab (Ctrl+W)" aria-label="Close tab" tabindex="-1">
        <svg viewBox="0 0 16 16"><path d="M4.75 4.75l6.5 6.5M11.25 4.75l-6.5 6.5"/></svg>
      </button>
    </div>
  </template>

  <script src="chrome.js"></script>
</body>
</html>
